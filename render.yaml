services:
  # ==========================================
  # 🚀 Code Lens Backend API (Express.js)
  # ==========================================
  - type: web
    name: code-lens-backend
    runtime: node
    plan: free
    rootDir: BACKEND
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # ==========================================
  # 🌐 Code Lens Frontend (React + Vite)
  # ==========================================
  - type: web
    name: code-lens-frontend
    runtime: static
    rootDir: FRONTEND/vite-project
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
